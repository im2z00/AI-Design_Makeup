<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>뷰티 AI 온보딩</title>
<meta name="api-base" content="/api">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 390×844 iOS frame centred on a cool stage, screen navigator beside it; the app itself is one deliberate light look (white + clear blue).
   Token names (rose-*) are kept from v1; they now hold the blue accent scale. */
:root{
  --stage:#EDF1F7;      /* outside the phone */
  --app:#FFFFFF;        /* app background */
  --card:#FFFFFF;
  --sand:#F3F6FA;       /* quiet fills */
  --line:#E3E8EF;
  --rose:#4D8BFF;       /* accent */
  --rose-deep:#2F6BFF;  /* CTA */
  --rose-soft:#E6EFFF;
  --rose-tint:#F3F7FF;
  --ink:#121826;
  --ink-2:#556070;
  --ink-3:#9AA3B0;
  --ok:#2F6BFF;         /* analysis done: same blue as the accent */
  --ok-ink:#2F6BFF;
  --ok-soft:#E6EFFF;
  --bezel:#15181D;
  --on-accent:#FFFFFF;
  --up:#F0466B;         /* ranking: rose */
  --down:#2F6BFF;       /* ranking: dropped */
  --shade:rgba(15,23,42,.36);
  --font:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* ---------- scrollbars: light-gray bar only ---------- */
*::-webkit-scrollbar{width:10px;height:10px;background:transparent}
*::-webkit-scrollbar-track{background:transparent;margin:8px 0}
*::-webkit-scrollbar-thumb{background:#D5DAE2;background-clip:padding-box;border:3px solid transparent;border-right-width:4px;border-radius:6px}
*::-webkit-scrollbar-thumb:hover{background-color:#C4CAD4}
*::-webkit-scrollbar-button{display:none;width:0;height:0}
*::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:#D5DAE2 transparent}}

/* ---------- stage ---------- */
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.devwrap{position:relative;flex:none}
.device{position:absolute;top:0;left:0;width:390px;height:844px;border-radius:54px;background:var(--app);overflow:hidden;box-shadow:0 0 0 11px var(--bezel),0 34px 70px rgba(30,50,90,.18);transform-origin:top left}
.nav{width:260px;align-self:center;display:flex;flex-direction:column;gap:14px}
.nav h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.nav p{margin:0;font-size:13px;line-height:1.55;color:var(--ink-2)}
.nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav li button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:10px;font-size:13.5px;color:var(--ink-2)}
.nav li button:hover{background:rgba(255,255,255,.5)}
.nav li button[aria-current="true"]{background:var(--card);color:var(--ink);font-weight:700}
.nav li .code{font-size:11.5px;width:38px;flex:none;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:600}
.nav li.sub button{padding-left:22px}
.nav-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savestate{font-size:12px;color:var(--ink-3)}
.pv-note{font-size:12.5px!important;line-height:1.5;color:var(--rose-deep)!important;background:var(--rose-tint);border-radius:10px;padding:8px 10px}
.nav .reset.confirm{background:var(--up);border-color:var(--up);color:var(--on-accent)}
.nav .reset{align-self:flex-start;font-size:13px;color:var(--rose-deep);font-weight:600;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}

/* ---------- screen skeleton ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--app)}
.scr.in-fwd{animation:inF .32s cubic-bezier(.2,.8,.2,1)}
.scr.in-back{animation:inB .32s cubic-bezier(.2,.8,.2,1)}
@keyframes inF{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inB{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
.status{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 36px;font-size:15px;font-weight:700}
.status .r{display:flex;gap:6px;align-items:center}
.top{height:52px;flex:none;display:grid;grid-template-columns:44px 1fr 92px;align-items:center;padding:0 12px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.iconbtn:disabled{visibility:hidden}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.prog i.on{background:var(--rose)}
.prog-wrap{display:flex;flex-direction:column;gap:5px;align-items:center}
.prog-wrap small{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:600}
.prog-wrap .prog{width:100%}
.skip{justify-self:end;font-size:13.5px;color:var(--ink-2);padding:8px 6px;font-weight:500}
.body{flex:1;overflow-y:auto;padding:6px 24px 28px;display:flex;flex-direction:column;gap:22px}
.body>*{flex-shrink:0}
.foot{flex:none;height:104px;padding:12px 20px 36px;background:var(--app);position:relative;z-index:6}
.foot.tall{height:auto}
.cta{width:100%;height:56px;border-radius:16px;background:var(--rose-deep);color:var(--on-accent);font-size:17px;font-weight:700;transition:background .2s,transform .1s}
.cta:active:not(:disabled){transform:scale(.985)}
.cta:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.sublink{display:block;margin:10px auto 0;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--ink);transform:translateX(-50%);z-index:40;pointer-events:none}

/* guide line: why we ask + what you get */
.guide{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--rose-soft);color:var(--ink);font-size:13.5px;line-height:1.5;font-weight:500}
.guide .ic{flex:none;color:var(--rose-deep);margin-top:1px}
h1.title{margin:0;font-size:24px;line-height:1.36;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.lead{margin:-12px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:10px}
.label{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.label em{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:500}
.nick-wrap{position:relative;display:flex}
.nick-wrap .input{flex:1;min-width:0;padding-right:60px}
.dice{position:absolute;right:7px;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:12px;background:none;color:var(--ink-3);display:grid;place-items:center}
.dice:hover{color:var(--ink-2)}
.dice.roll .ic{animation:roll .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes roll{from{transform:rotate(-200deg) scale(.7)}to{transform:none}}
.input{height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:16px;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--rose)}
.input::placeholder{color:var(--ink-3)}
.help{font-size:12.5px;color:var(--ink-3);margin-top:-2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:42px;padding:0 16px;border-radius:21px;border:1.5px solid var(--line);background:var(--card);font-size:14.5px;font-weight:500;color:var(--ink-2);transition:all .15s}
.chip[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-tint);color:var(--rose-deep);font-weight:700}

/* ---------- S0 ---------- */
.s0 .body{gap:0;padding-top:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--rose-deep);letter-spacing:-.02em}
.brand b{width:26px;height:26px;border-radius:9px;background:var(--rose-deep);display:grid;place-items:center;color:var(--on-accent);font-size:13px}
.hero-h{margin:26px 0 0;font-size:29px;line-height:1.32;font-weight:800;letter-spacing:-.04em;text-wrap:balance}
.hero-h span{color:var(--rose-deep)}
.hero-s{margin:12px 0 0;font-size:15px;line-height:1.55;color:var(--ink-2)}
.carousel{margin:26px -24px 0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:12px;padding:0 24px}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.slide .step{font-size:12px;font-weight:700;color:var(--rose-deep);letter-spacing:.02em}
.slide h3{margin:-8px 0 0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.slide p{margin:-8px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.slide .vis{height:196px;border-radius:12px;background:var(--sand);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.dots button{width:7px;height:7px;border-radius:4px;background:var(--line);transition:all .25s}
.dots button.on{width:20px;background:var(--rose)}
.mini-search{position:absolute;top:18px;left:18px;right:18px;height:38px;border-radius:19px;background:var(--card);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;color:var(--ink);box-shadow:0 2px 8px rgba(30,50,90,.08)}
.mini-search .ic{color:var(--ink-3)}
.mini-prod{position:absolute;left:18px;right:18px;bottom:18px;background:var(--card);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}
.pal{width:52px;height:52px;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px;background:var(--sand)}
.pal i{border-radius:4px}
.mini-prod b{display:block;font-size:13.5px}
.mini-prod small{font-size:12px;color:var(--ink-3)}
.hero-face{width:172px;height:172px;border-radius:50%;overflow:hidden;box-shadow:0 8px 20px rgba(20,35,70,.14)}
.hero-face svg{width:100%;height:100%;display:block}
.mini-tag{position:absolute;font-size:11.5px;font-weight:700;background:var(--card);border-radius:10px;padding:5px 9px;box-shadow:0 2px 8px rgba(30,50,90,.1);color:var(--ink)}
.mini-tag.rose{background:var(--rose-deep);color:var(--on-accent)}

/* ---------- S2 ---------- */
.mood-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood{position:relative;border-radius:16px;background:var(--card);border:2px solid var(--line);padding:8px 8px 12px;display:flex;flex-direction:column;gap:9px;text-align:left;transition:border-color .15s,transform .15s}
.mood .chart{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:10px 8px;border-radius:11px}
.mood .cc{display:flex;flex-direction:column;align-items:center;gap:4px}
.mood .cc i{display:block;width:100%;height:46px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.mood .cc small{font-size:10.5px;font-weight:600;color:var(--ink-2)}
.mood .nm{padding:0 4px;font-size:14.5px;font-weight:800}
.mood .kws{padding:0 4px;display:flex;flex-wrap:wrap;gap:4px;margin-top:-3px}
.mood .kws em{font-style:normal;font-size:11.5px;font-weight:500;color:var(--ink-2);background:var(--sand);border-radius:6px;padding:2px 6px}
.mood[aria-pressed="true"]{border-color:var(--rose)}
.mood[aria-pressed="true"] .kws em{background:var(--rose-tint);color:var(--rose-deep)}
.mood .badge{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--on-accent);z-index:1}
.mood:not([aria-pressed="true"]) .badge{display:none}
.mood[aria-pressed="true"] .badge{background:var(--rose-deep);border-color:var(--rose-deep)}
.mood.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pick-sum{display:flex;align-items:center;gap:8px;min-height:34px;margin-bottom:10px;flex-wrap:wrap}
.pick-sum .hash{font-size:13.5px;font-weight:700;color:var(--rose-deep);background:var(--rose-tint);border-radius:14px;padding:5px 11px}
.pick-sum .hint{font-size:13px;color:var(--ink-3)}
.pick-sum .cnt{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- personal color ---------- */
.season{display:flex;flex-direction:column;gap:10px}
.season-h{display:flex;align-items:center;gap:8px}
.season-h b{font-size:15px;font-weight:800}
.season-h .wc{font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--sand);border-radius:8px;padding:2px 8px}
.pc-grid{display:flex;flex-direction:column;gap:8px}
.pcc{position:relative;border-radius:16px;background:var(--card);border:2px solid var(--line);padding:10px 40px 10px 10px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;text-align:left;transition:border-color .15s}
.pcc .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.tone-chip{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tone-chip i{display:block;height:28px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.pcc .nm{font-size:14px;font-weight:800;margin-top:2px}
.pcc .tone{font-size:11.5px;line-height:1.4;color:var(--ink-2);font-weight:500;margin-top:-4px}
.pcc .nm{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.x16{font-size:10px;font-weight:700;color:var(--rose-deep);background:var(--rose-tint);border-radius:5px;padding:1px 5px}
.season-h{flex-wrap:wrap}
.season-h .feel{font-size:12px;color:var(--ink-3);font-weight:500}
.pcc .kws{display:flex;flex-wrap:wrap;gap:4px}
.pcc .kws em{font-style:normal;font-size:11px;font-weight:500;color:var(--ink-2);background:var(--sand);border-radius:6px;padding:2px 6px}
.pcc .ck,.pc-unknown .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:transparent;flex:none}
.pcc .ck{position:absolute;top:50%;right:12px;margin-top:-11px}
.pcc[aria-pressed="true"],.pc-unknown[aria-pressed="true"]{border-color:var(--rose)}
.pcc[aria-pressed="true"] .ck,.pc-unknown[aria-pressed="true"] .ck{background:var(--rose-deep);border-color:var(--rose-deep);color:var(--on-accent)}
.pcc[aria-pressed="true"] .kws em{background:var(--rose-tint);color:var(--rose-deep)}
.pc-unknown{display:flex;gap:12px;align-items:center;text-align:left;border-radius:16px;border:2px dashed var(--line);background:var(--card);padding:14px 16px}
.pc-unknown[aria-pressed="true"]{border-style:solid}
.pc-unknown b{display:block;font-size:14.5px;font-weight:800}
.pc-unknown small{font-size:12.5px;color:var(--ink-2);line-height:1.45}

/* ---------- S3 chat ---------- */
.s3 .body{padding:0;gap:0;overflow:hidden}
.banner{margin:4px 16px 0;flex:none}
.banner .guide{padding-right:8px}
.banner .guide .txt{flex:1}
.banner .tog{flex:none;color:var(--ink-2);width:28px;height:24px;display:grid;place-items:center;border-radius:8px}
.banner-min{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:6px 10px;border-radius:12px;background:var(--rose-soft);width:max-content;font-weight:600}
.banner-min .ic{color:var(--rose-deep)}
.chat{flex:1 1 0;min-height:0;overflow-y:auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;font-size:14.5px;line-height:1.55;padding:11px 14px;border-radius:18px;white-space:pre-line;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.ghost{align-self:flex-end;max-width:84%;font-size:14px;line-height:1.55;padding:10px 14px;border-radius:18px;border-top-right-radius:6px;border:1.5px dashed var(--line);color:var(--ink-3);background:var(--sand);display:flex;flex-direction:column;gap:3px}
.ghost span{font-size:11.5px;font-weight:700;letter-spacing:.02em}
.msg.ai{background:var(--card);border-top-left-radius:6px;align-self:flex-start;border:1px solid var(--line)}
.msg.me{background:var(--rose-deep);color:var(--on-accent);border-top-right-radius:6px;align-self:flex-end}
.ai-row{display:flex;gap:8px;align-items:flex-start}
.ava{width:30px;height:30px;border-radius:10px;background:var(--rose-deep);color:var(--on-accent);display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}
.msg .hintline{display:block;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.typing{display:flex;flex-direction:column;gap:6px}
.typing .dots3{display:flex;gap:4px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;border-top-left-radius:6px;width:max-content}
.typing .dots3 i{width:7px;height:7px;border-radius:50%;background:var(--rose);animation:blink 1.1s infinite}
.typing .dots3 i:nth-child(2){animation-delay:.18s}.typing .dots3 i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.typing small{font-size:12.5px;color:var(--ink-2);font-weight:600;padding-left:2px}
.quick{display:flex;gap:5px;padding:0 40px 8px 16px;flex:none;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
.quick::-webkit-scrollbar{display:none}
.quick.end{-webkit-mask-image:none;mask-image:none}
.quick button{flex:none;height:32px;padding:0 11px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.quick button[aria-pressed="true"]{display:inline-flex;align-items:center;gap:4px;cursor:default;border-color:var(--rose);color:var(--rose-deep);background:var(--rose-tint);font-weight:700}
.composer{flex:none;margin:0 16px 10px;display:flex;align-items:flex-end;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:6px 6px 6px 14px}
.composer:focus-within{border-color:var(--rose)}
.composer textarea{flex:1;border:0;outline:0;resize:none;background:none;font:inherit;font-size:14.5px;line-height:1.45;padding:7px 0;max-height:96px;min-height:22px;color:var(--ink)}
.composer textarea::placeholder{color:var(--ink-3)}
.mic,.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.mic{color:var(--ink-2)}
.mic.on{background:var(--rose-soft);color:var(--rose-deep);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(47,107,255,.18)}}
.send{background:var(--rose-deep);color:var(--on-accent)}
.send:disabled{background:var(--line);color:var(--ink-3)}
.demo-note{flex:none;margin:0 20px 6px;font-size:11.5px;color:var(--ink-3)}

/* routine sheet */
.dim{position:absolute;inset:0;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .3s;z-index:4}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:104px;z-index:5;background:var(--app);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(20,35,70,.12);display:flex;flex-direction:column;max-height:calc(100% - 104px - 180px);transform:translateY(110%);transition:transform .38s cubic-bezier(.2,.85,.2,1)}
.sheet.open{transform:none}
.sheet.peek{transform:translateY(calc(100% - 72px))}
.sheet-h{flex:none;padding:8px 20px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet-h .row{display:flex;align-items:center;gap:10px}
.sheet-h h3{margin:0;font-size:17px;font-weight:800}
.sheet-h .meta{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.src{font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;background:var(--sand);color:var(--ink-3)}
.src.ai{background:var(--rose-soft);color:var(--rose-deep)}
.sheet-h .ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.sheet-h .ttl h3,.sheet-h .ttl .meta,.sheet-h .mode{white-space:nowrap}
.sheet-h .hbtns{margin-left:auto;display:flex;gap:6px;flex:none}
.sheet-h .hbtns .mode{margin-left:0;padding:0 11px;font-size:12.5px;gap:4px}
.sheet-h .mode.sub{background:var(--sand);color:var(--ink-2)}
.s3 .body.peeked{padding-bottom:72px}
.sheet-h .mode{height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:700;color:var(--rose-deep);background:var(--rose-tint);display:flex;align-items:center;gap:5px}
.sheet-tip{flex:none;margin:-2px 20px 10px;font-size:12px;color:var(--ink-2);background:var(--sand);border-radius:10px;padding:8px 10px;line-height:1.45}
.steps{flex:1;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.sw-wrap{position:relative;border-radius:16px;overflow:hidden;flex:none}
.sw-del{position:absolute;inset:0;background:var(--rose-deep);display:flex;justify-content:flex-end;align-items:center;padding-right:18px;color:var(--on-accent);font-size:13px;font-weight:700;gap:4px}
.stepc{position:relative;background:var(--card);border-radius:16px;border:1px solid var(--line);padding:12px 12px 12px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;touch-action:pan-y;transition:transform .22s;user-select:none;-webkit-user-select:none}
.stepc.dragging{transition:none;box-shadow:0 12px 26px rgba(20,35,70,.18);z-index:3;transform:scale(1.02)}
.stepc.held{transform:scale(.98)}
.num{width:26px;height:26px;border-radius:50%;background:var(--rose-soft);color:var(--rose-deep);font-size:12.5px;font-weight:800;display:grid;place-items:center;margin-top:1px;font-variant-numeric:tabular-nums}
.stepc .main{min-width:0;display:flex;flex-direction:column;gap:7px}
.stepc .cat{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:var(--rose-tint);border:1px solid var(--rose-soft);font-size:13.5px;font-weight:700;color:var(--ink)}
.pchip .brand-nm{font-weight:500;color:var(--rose-deep)}
.unk{font-size:11.5px;color:var(--ink-3);background:var(--sand);border-radius:10px;padding:3px 8px;font-weight:600}
.addname{font-size:12px;color:var(--rose-deep);font-weight:700;padding:4px 2px;display:inline-flex;gap:2px;align-items:center}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:8px;padding:3px 8px;background:var(--sand);color:var(--ink-2);font-weight:500}
.plist{display:flex;flex-direction:column;gap:6px}
.addprod{align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;gap:3px;align-items:center;padding:5px 10px;border-radius:12px;border:1.5px dashed var(--line)}
.xprod{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:var(--sand)}
.prod-in{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prod-in input{height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:0 10px;font-size:13.5px;outline:none;min-width:0}
.prod-in input:focus{border-color:var(--rose)}
.prod-in .btns{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.stepc .acts{display:flex;gap:2px;align-items:center}
.stepc .acts button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.stepc .handle{cursor:grab;touch-action:none;color:var(--ink-3)}
.name-in{display:flex;gap:6px}
.name-in input,.ed input,.ed select{height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:0 10px;font-size:14px;outline:none;min-width:0}
.name-in input{flex:1}
.name-in input:focus,.ed input:focus,.ed select:focus{border-color:var(--rose)}
.sbtn{height:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:var(--rose-deep);color:var(--on-accent);font-size:13px;font-weight:700;flex:none}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin:0 4px 0 1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.anal-txt small{font-size:12px;color:var(--ink-3);font-weight:500}
.sbtn.muted{background:var(--sand);color:var(--ink-2)}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-3);font-weight:600}
.ed .full{grid-column:1/-1}
.ed .chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);grid-column:1/-1}
.ed .chk input{width:18px;height:18px;accent-color:var(--rose-deep)}
.ed .btns{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.addstep{flex:none;height:48px;border-radius:16px;border:1.5px dashed var(--line);color:var(--ink-2);font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center}

/* concern cards (S3 sheet) */
.ccard{flex:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.ccard.editing{display:block}
.ccard .area{font-size:11.5px;font-weight:800;color:var(--rose-deep);background:var(--rose-tint);border-radius:8px;padding:3px 8px;margin-top:1px;white-space:nowrap}
.ccard .main{display:flex;flex-direction:column;gap:3px;min-width:0}
.ccard .main b{font-size:14.5px;font-weight:700}
.ccard .main small{font-size:12px;color:var(--ink-3);line-height:1.45}
.ccard .acts{display:flex;gap:2px}
.ccard .acts button{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.cform{display:grid;grid-template-columns:92px 1fr;gap:6px}
.cform select,.cform input{height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:0 10px;font-size:14px;outline:none;min-width:0}
.cform select:focus,.cform input:focus{border-color:var(--rose)}
.cform .btns{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.nav li.sec{margin-top:10px;padding:6px 10px 2px;font-size:11.5px;font-weight:800;color:var(--rose-deep);letter-spacing:.02em}

/* ---------- core scene sketch ---------- */
.ctop{height:56px;flex:none;display:grid;grid-template-columns:44px 1fr auto;align-items:center;padding:0 18px 0 8px;gap:4px}
.ctop .ct{display:flex;flex-direction:column;min-width:0}
.ctop .ct b{font-size:16px;font-weight:800}
.ctop .ct small{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cstep{font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ainote{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink-2);background:var(--sand);border-radius:14px;padding:11px 12px}
.ainote .ic{flex:none;color:var(--rose-deep);margin-top:2px}
.ainote b{color:var(--rose-deep);font-weight:800;margin-right:2px}
.cand{display:flex;flex-direction:column;gap:8px}
.candc{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.candc .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.candc b{font-size:14.5px;font-weight:700}
.candc small{font-size:12px;color:var(--ink-3)}
.cpick{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.cpick input{width:40px;height:32px;border:1.5px solid var(--line);border-radius:8px;padding:2px;background:var(--card);cursor:pointer}
.chip.addc{display:inline-flex;align-items:center;gap:4px;border-style:dashed;color:var(--rose-deep);font-weight:700}
.candc .brandnm{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.candc svg{display:block;border-radius:10px}
.pthumb{display:block;width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--sand)}
.candc .ck,.dir .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:transparent}
.candc[aria-pressed="true"],.dir[aria-pressed="true"]{border-color:var(--rose)}
.candc[aria-pressed="true"] .ck,.dir[aria-pressed="true"] .ck{background:var(--rose-deep);border-color:var(--rose-deep);color:var(--on-accent)}
.swc{display:inline-flex;align-items:center;gap:7px}
.note.srcs{text-align:left;line-height:1.6}
.note.srcs a{color:var(--rose-deep);text-decoration:underline;text-underline-offset:2px}
.swc.ph{padding-left:6px}
.swc.ph i{width:28px;height:28px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.swc i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.qa{display:flex;flex-direction:column;gap:8px}
.qa .msg{max-width:84%}
.qa .msg.me{align-self:flex-end}
.qa .why{padding-left:38px;font-size:12px;color:var(--ink-3);margin-top:-2px}
.qa .chips{padding-left:38px}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dir{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px}
.dir .fv{aspect-ratio:1/1;max-width:100%;border-radius:12px;overflow:hidden;display:block}
.dir .fv{position:relative}
.dir .fv svg{width:100%;height:100%;display:block}
.mk-photo{position:absolute;inset:0;display:block}
.mk-photo img{width:100%;height:100%;object-fit:cover;display:block}
.mk-photo svg{position:absolute;inset:0}
.fv-tag{position:absolute;left:6px;bottom:6px;font-style:normal;font-size:10.5px;font-weight:800;color:#FFFFFF;background:rgba(20,30,50,.55);border-radius:6px;padding:2px 6px}
.dir b{font-size:15px;font-weight:800}
.dir small{font-size:12px;color:var(--ink-2);line-height:1.45;margin-top:-4px}
.dir .ck{position:absolute;top:16px;right:16px}
.linkbtn{align-self:center;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:4px}
.loading-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink);font-size:15px;font-weight:700;text-align:center;padding:0 32px 80px}
.loading-c small{font-size:12.5px;color:var(--ink-3);font-weight:500}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--rose-soft);border-top-color:var(--rose);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lookhd{background:var(--rose-tint);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.lookhd .eyebrow{font-size:12px;font-weight:700;color:var(--rose-deep)}
.lookhd b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.lookhd .tags{margin-top:2px}
.lookhd .tag{background:var(--card)}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--rose-deep);box-shadow:0 1px 3px rgba(20,35,70,.1)}
.eyeguide{background:var(--sand);border-radius:16px;padding:8px 8px 10px}
.eyeguide svg{width:100%;height:auto;display:block}
.eyeguide p{margin:2px 0 0;text-align:center;font-size:12px;color:var(--ink-2)}
.lsteps{display:flex;flex-direction:column;gap:8px}
.lstep{display:grid;grid-template-columns:26px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.lstep.new{border:1.5px solid var(--rose);background:var(--rose-tint)}
.lstep .main{display:flex;flex-direction:column;gap:5px;min-width:0}
.lstep .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lstep .hd .cat{font-size:12px;font-weight:700;color:var(--ink-3)}
.badge2{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--sand);color:var(--ink-2)}
.badge2.new{background:var(--rose-deep);color:var(--on-accent)}
.lstep .item{font-size:14.5px;font-weight:700}
.lstep .how{font-size:13px;line-height:1.5;color:var(--ink-2)}
.lstep .fix{font-size:12px;color:var(--rose-deep);font-weight:600}
.lstep .alt{align-self:flex-start;margin-top:2px;font-size:12px;font-weight:700;color:var(--ink-2);border:1.5px solid var(--line);border-radius:10px;padding:4px 9px;display:inline-flex;gap:4px;align-items:center;background:var(--card)}
.foot.dual{display:flex;gap:8px}
.cta.sec{flex:0 0 auto;width:auto;padding:0 18px;background:var(--sand);color:var(--ink)}
.cta.sec2{background:var(--sand);color:var(--ink)}
.vlist{display:flex;flex-direction:column;gap:8px}
.vcard{display:grid;grid-template-columns:112px 1fr;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;align-items:center}
.vthumb{position:relative;height:84px;border-radius:10px;display:grid;place-items:center;color:#FFFFFF}
.vthumb .play{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center}
.vthumb .len{position:absolute;right:6px;bottom:6px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.55);border-radius:5px;padding:1px 5px}
.vcard .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.vcard .src{font-size:11.5px;font-weight:700;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vcard .src .fav{color:var(--rose-deep);background:var(--rose-tint);border-radius:6px;padding:1px 6px}
.vcard b{font-size:14px;line-height:1.4}
.vcard .at{font-size:12px;color:var(--rose-deep);font-weight:600;display:flex;gap:4px;align-items:center}
.fit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 14px}
.fit ul{margin:0;padding:0}
.fit li{list-style:none;display:grid;grid-template-columns:22px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5}
.fit li:last-child{border-bottom:0}
.fit .mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose-deep);margin-top:1px;font-size:12px;font-weight:800}
.fit .mk.warn{background:var(--sand);color:var(--ink-2)}
.fit li b{display:block;font-size:12px;color:var(--ink-3);font-weight:700}
.prices{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 2px;scroll-margin-top:12px}
.prices-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.prices-h b{font-size:15px;font-weight:800}
.prices-h small{font-size:11.5px;color:var(--ink-3)}
.prow2{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.prow2:last-child{border-bottom:0}
.prow2 .st{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center}
.prow2 .pr{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.prow2 small{font-size:12px;color:var(--ink-3)}
.prow2 .go{font-size:12px;color:var(--rose-deep);font-weight:700;text-align:right;display:inline-flex;gap:2px;align-items:center;justify-content:flex-end}
.prow2 .go .ic{transform:rotate(-90deg)}
.low{font-size:10.5px;font-weight:800;color:var(--on-accent);background:var(--up);border-radius:5px;padding:1px 5px}
.pop-btns{display:flex;gap:8px;width:100%}
.pop-btns .cta{flex:1;display:grid;place-items:center;text-decoration:none}
.pop-btns .cta.sec{flex:1}

/* cover-flow look (C4) */
.roles{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roles>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.roles>div.me{background:var(--rose-tint);border-color:transparent}
.roles b{font-size:12px;font-weight:800;color:var(--rose-deep);margin-bottom:2px}
.roles span{font-size:12.5px;color:var(--ink);line-height:1.4}
.roles span::before{content:'· ';color:var(--ink-3)}
.roles p{grid-column:1/-1;margin:0;font-size:11.5px;color:var(--ink-3);line-height:1.45}
.mini-res{position:absolute;left:16px;right:16px;top:16px;bottom:16px;background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(30,50,90,.08)}
.mini-res .mr-h{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mini-res .mr-h b{font-size:13.5px;font-weight:800;margin-right:4px;width:100%}
.mini-res .mr-h span,.mini-res .mr-chips span{font-size:10.5px;font-weight:700;color:var(--rose-deep);background:var(--rose-tint);border-radius:7px;padding:2px 6px}
.mini-res .mr-why{font-size:11.5px;line-height:1.45;color:var(--ink-2);background:var(--sand);border-radius:8px;padding:6px 8px}
.mini-res .mr-why i,.cfc .why span{font-style:normal;display:inline-block;font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;margin-right:5px;background:var(--rose-deep);color:var(--on-accent)}
.mini-res .mr-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;align-items:center}
.mini-res .mr-chips small{font-size:10.5px;color:var(--ink-3);margin-right:2px}
.mini-res .mr-chips span{background:var(--card);border:1.5px solid var(--rose);}
.lb-row{display:flex;align-items:center;gap:6px}
.lb-row .ver{font-size:10.5px;font-weight:800;color:var(--ink-2);background:var(--sand);border-radius:6px;padding:2px 6px}
.conds{display:flex;align-items:center;gap:6px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:7px 8px 7px 10px}
.conds .lk-tags{flex:1;min-width:0}
.conds .ed{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--rose-deep)}
.lbrow2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.whylink{font-size:12px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:3px;padding:2px 0}
.whylink .ic{transition:transform .2s}.whylink[aria-expanded="true"] .ic{transform:rotate(180deg)}
.vbar{font-size:11.5px;font-weight:800;color:var(--rose-deep);background:var(--rose-tint);border-radius:8px;padding:3px 8px;margin-left:auto}
.whyl{background:var(--sand);border-radius:12px;padding:4px 10px;margin:0}
.whyl li{list-style:none;display:grid;grid-template-columns:62px 1fr auto;gap:6px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.45;color:var(--ink-2)}
.whyl li:last-child{border-bottom:0}
.whyl li b{font-size:11.5px;color:var(--ink);font-weight:800}
.whyl li em{font-style:normal;color:var(--rose-deep);font-weight:700}
.whyl li button{font-size:11px;font-weight:800;color:var(--rose-deep);text-decoration:underline;text-underline-offset:2px}
.whyl .src{grid-template-columns:1fr;font-size:11px;color:var(--ink-3)}
.skipped{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.skipped button{font-weight:800;color:var(--rose-deep);text-decoration:underline;text-underline-offset:2px}
.cfc .why{margin:0;font-size:12px;line-height:1.5;color:var(--ink-2)}
.srcb{align-self:flex-start;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:-3px;background:var(--sand);color:var(--ink-2)}

/* ================= concern extraction (keyword stand-in for the AI) ================= */
// Each rule: a pattern found in one clause → a short concern label. area null = use the clause's own area.
const CONCERN_RULES=[
 [/무너|지속|지워|사라/,'베이스','오후에 베이스가 무너짐'],
 [/번들|유분|기름/,'베이스','번들거림·유분'],
 [/들뜨|들떠|건조/,null,'건조하고 들뜸'],
 [/모공/,'베이스','모공이 부각됨'],
 [/다크/,'베이스','다크서클'],
 [/붉|홍조|트러블|잡티/,'베이스','붉은기·잡티 커버'],
 [/칙칙/,null,'칙칙해 보임'],
 [/비슷|단조|매번|늘 같|똑같/,null,'룩이 늘 비슷함'],
 [/번져|번짐|판다/,'아이','아이 메이크업 번짐'],
 [/뭉쳐|뭉침|뭉치/,null,'뭉침'],
 [/각질/,null,'각질'],
 [/어려|모르겠|못하|자신 ?없|서툴/,null,'바르는 방법이 어려움'],
 [/안 ?어울|어색/,null,'색이 잘 안 어울림'],
 [/작아|작은 눈|쳐진|처진|홑꺼풀|무쌍/,'아이','눈매 보완'],
 [/시간이|바빠|바쁜|빨리|급하/,null,'시간이 부족함'],
];
const KEEP_LABEL=['룩이 늘 비슷함','바르는 방법이 어려움','색이 잘 안 어울림','시간이 부족함'];
const areaOf=cl=>/입술|립|틴트|립스틱/.test(cl)?'립':/눈|섀도|아이|마스카라|라이너|속눈썹|꺼풀/.test(cl)?'아이':/볼|블러셔|치크|혈색/.test(cl)?'치크':/쿠션|파데|파운데이션|베이스|피부|모공|코|이마|유분|번들|다크|홍조|잡티/.test(cl)?'베이스':'전체';
const AREA_WORD={베이스:'피부',아이:'눈두덩',치크:'볼',립:'입술',전체:''};
function extractConcerns(text){
  const clauses=text.split(/(?<=[.!?\n])\s*|(?<=고)\s+|,\s*/).map(s=>s.trim()).filter(Boolean);
  const out=[],seen=new Set();
  for(const cl of clauses){
    const area0=areaOf(cl);
    for(const [re,area,label] of CONCERN_RULES){
      if(!re.test(cl))continue;
      const a=area||area0;
      let t=label;
      if(label==='뭉침')t=a==='립'?'립이 뭉침':a==='아이'?'마스카라·섀도우 뭉침':'뭉침';
      else if(!area&&a!=='전체'&&!KEEP_LABEL.includes(label))t=`${AREA_WORD[a]} ${label}`;
      if(seen.has(t))continue;seen.add(t);
      out.push({id:newId(),area:a,text:t,quote:cl.replace(/[.,]$/,'')});
    }
  }
  return out.slice(0,8);
}

const dev=document.getElementById('device');

/* ---- live camera for the face photo (works where the browser allows it: local file in Chrome, deployed site) ---- */
let camStream=null;
function stopCamera(){if(camStream){camStream.getTracks().forEach(tr=>tr.stop());camStream=null}}
async function startCamera(){
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    try{
      camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:1280}},audio:false});
      S.camera=true;S.camLive=true;render();return;
    }catch(e){stopCamera()}
  }
  // blocked or unavailable: phones open their own camera app, desktops show the example photo
  if(matchMedia('(pointer:coarse)').matches){dev.querySelector('#camfile')?.click();return}
  S.camera=true;S.camLive=false;render();
}
function shootLive(){
  const v=dev.querySelector('#camv');if(!v||!v.videoWidth)return;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  const g=c.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(v,0,0); // keep the mirrored view the user saw
  stopCamera();
  const fl=document.createElement('div');fl.className='flash';dev.appendChild(fl);setTimeout(()=>fl.remove(),400);
  c.toBlob(b=>{Object.assign(S,{camera:false,camLive:false,photo:c.toDataURL('image/jpeg',.9),photoFile:b,photoDims:{w:c.width,h:c.height}});analyze()},'image/jpeg',.9);
}
function go(id,dir='fwd'){
  clearTimers();S.repOpen=false;stopCamera();S.listening=false;S.camera=false;S.camLive=false;
  S.screen=id;anim=dir;render();
  if(id==='s3')enterS3();
}
function next(from){
  if(S.returnTo){const r=S.returnTo;S.returnTo=null;go(r,'back');if(r==='c4')toast('바뀐 정보로 룩을 다시 맞췄어요');return}
  go(ORDER[ORDER.indexOf(from)+1]);
}
function back(){
  if(S.returnTo){const r=S.returnTo;S.returnTo=null;go(r,'back');return}
  const i=ORDER.indexOf(S.screen);if(i>0)go(ORDER[i-1],'back');
}
function toast(t){
  dev.querySelectorAll('.toast').forEach(e=>e.remove());
  const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;dev.appendChild(d);
  setTimeout(()=>d.remove(),2400);
}

}

// Quick replies: "no concerns" first, then common concerns (each maps to a keyword rule in extractConcerns).
const CONCERN_CHIPS=['베이스가 잘 무너져요','코 옆이 번들거려요','건조해서 들떠요','모공이 부각돼요','다크서클이 고민이에요','피부가 칙칙해 보여요','눈 화장이 늘 비슷해요','아이 메이크업이 번져요','눈매가 작아 보여요','블러셔가 어색해요','입술 각질이 고민이에요','틴트가 뭉쳐요','바르는 방법이 어려워요','아침에 시간이 부족해요'];
const QUICK=['특별한 고민은 없어요',...CONCERN_CHIPS];
// Once concerns exist the chips stay, as add-on suggestions minus the ones already in the list.
const QUICK_MORE=CONCERN_CHIPS;
function quickChips(r){return r?QUICK_MORE:QUICK}
// Chosen chips move to the front, stacked in the order they were chosen; the rest keep their order.
function orderedChips(r){
  const list=quickChips(r),sent=S.chat.filter(m=>m.from==='me').map(m=>m.text);
  const rank=q=>{const i=sent.indexOf(q);return i>=0?i:chipUsed(q,r)?sent.length:Infinity};
  return list.map((q,i)=>({q,i,k:rank(q)})).sort((a,b)=>a.k-b.k||a.i-b.i).map(x=>x.q);
}
// A chip shows as chosen once its text was sent, or once its concern is already in the list.
function chipUsed(q,r){
  if(S.chat.some(m=>m.from==='me'&&m.text===q))return true;
  if(!r||!r.length)return false;
  const key=x=>x.replace(/^(피부|눈두덩|볼|입술) /,''),have=new Set(r.map(c=>key(c.text)));
  return extractConcerns(q).some(c=>have.has(key(c.text)));
}
function sheetHTML(){
  const r=S.concerns;
  return `<section class="sheet ${S.sheet}" aria-label="정리된 고민">
  <div class="sheet-h" data-act="toggleSheet"><span class="grab"></span>
   <div class="row"><div class="ttl"><h3>정리된 고민</h3><span class="meta">${r.length}개 · 추천 룩에 반영돼요</span></div>

// Face landmarks are ellipses in % of the original photo; the preview is a square `object-fit:cover`
// crop, so they are mapped into the square before drawing.
const DEMO_LM={face:{cx:50,cy:51.7,rx:24.2,ry:29.2},leftEye:{cx:40,cy:51.7,rx:7.1,ry:3.8},rightEye:{cx:60,cy:51.7,rx:7.1,ry:3.8},nose:{cx:50,cy:55,rx:3,ry:6.7},lips:{cx:50,cy:70.8,rx:7.9,ry:3.5}};
const AVG_LM={face:{cx:50,cy:48,rx:22,ry:28},leftEye:{cx:41,cy:44,rx:6,ry:3},rightEye:{cx:59,cy:44,rx:6,ry:3},nose:{cx:50,cy:53,rx:3,ry:6},lips:{cx:50,cy:64,rx:7,ry:3}};
const PARTS=['face','leftEye','rightEye','nose','lips'];
function mapLm(lm,dims){
  const w=dims.w,h=dims.h,s=Math.max(1/w,1/h),ox=(w*s-1)/2,oy=(h*s-1)/2,out={};
  for(const k of PARTS){const o=lm[k];out[k]={cx:(o.cx/100*w*s-ox)*100,cy:(o.cy/100*h*s-oy)*100,rx:o.rx/100*w*s*100,ry:o.ry/100*h*s*100}}
  return out;
}
function overlay(){
  const m=mapLm(S.faceLm||DEMO_LM,S.photoDims||{w:1,h:1}),c='#FFFFFF',d='2 1.6',f=n=>n.toFixed(1);
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const e=o=>`<ellipse cx="${f(o.cx)}" cy="${f(o.cy)}" rx="${f(o.rx)}" ry="${f(o.ry)}" fill="none" stroke="${c}" stroke-width=".75" stroke-dasharray="${d}"/>`;
  const dot=o=>`<circle cx="${f(o.cx)}" cy="${f(o.cy)}" r="1.2" fill="#2F6BFF" stroke="${c}" stroke-width=".5"/>`;
  const L=(x,y,txt)=>`<text x="${f(cl(x,2,86))}" y="${f(cl(y,5,97))}">${txt}</text>`;
  return `<svg class="ovl" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="filter:drop-shadow(0 0 1.2px rgba(20,40,90,.6))">
  ${e(m.face)}${e(m.leftEye)}${e(m.rightEye)}
  <path d="M${f(m.nose.cx)} ${f(m.nose.cy-m.nose.ry)}V${f(m.nose.cy+m.nose.ry)}" stroke="${c}" stroke-width=".75" stroke-dasharray="${d}"/>
  ${e(m.lips)}${dot(m.leftEye)}${dot(m.rightEye)}${dot({cx:m.nose.cx,cy:m.nose.cy+m.nose.ry})}${dot(m.lips)}
  <g font-size="3.8" font-weight="700" fill="#fff" font-family="Noto Sans KR,sans-serif">
   ${L(m.leftEye.cx-m.leftEye.rx-1,m.leftEye.cy-m.leftEye.ry-2.2,'눈매')}${L(m.nose.cx+2.5,m.nose.cy+1.2,'코')}${L(m.lips.cx+m.lips.rx+1.5,m.lips.cy+1.3,'입술')}${L(m.face.cx+m.face.rx*.55,m.face.cy-m.face.ry-1.2,'얼굴형')}</g></svg>`;
}

function parseQuery(q){
  const s=q.trim(),low=s.toLowerCase();
  const brand=BRANDS.find(b=>low.includes(b.toLowerCase()))||'';
  const cw=COLOR_WORDS.find(([w])=>s.includes(w));
  const num=(s.match(/(?:^|\s|#)(\d{1,3})(?:호|번)?(?=\s|$)/)||[])[1]||'';
  let rest=s;[brand,cw&&cw[0],num&&new RegExp('#?'+num+'(호|번)?')].forEach(x=>{if(x)rest=rest.replace(x,' ')});
  return{brand,color:cw?cw[0]:'',hex:cw?cw[1]:'',num,rest:rest.replace(/\s+/g,' ').trim()};
}

function searchBody(){
  const q=S.query.trim();
  if(!q)return `<div class="s-hint"><b>브랜드 + 색상만 입력해도 찾아드려요</b><div class="s-ex">${SEARCH_EX.map(x=>`<button data-act="pick" data-v="${x}">${x}</button>`).join('')}</div></div>
   <div class="rank-h"><b>지금 인기 색조 TOP 10</b><small>${RANK_SRC}</small></div>
   <ol class="rank">${RANK.slice(0,10).map(([n,c],i)=>`<li><button class="rk" data-act="pick" data-v="${n}"><span class="n ${i<3?'hi':''}">${i+1}</span>${rankImg(n)}<span class="t">${n}<small>${c}</small></span></button></li>`).join('')}</ol>`;
  const hits=RANK.filter(([n])=>n.replace(/\s/g,'').includes(q.replace(/\s/g,'')));
  const mark=n=>{const i=n.indexOf(q);return i<0?esc(n):esc(n.slice(0,i))+'<mark>'+esc(q)+'</mark>'+esc(n.slice(i+q.length))};
  const pq=parseQuery(q),bits=[pq.brand&&`브랜드 ${pq.brand}`,(pq.color||pq.num)&&`색상 ${[pq.color,pq.num].filter(Boolean).join(' ')}`,pq.rest&&(pq.brand||pq.color||pq.num)&&`제품 ${pq.rest}`].filter(Boolean);
  return `<ol class="rank sug"><li><button class="rk" data-act="pick" data-v="${esc(q)}"><span class="n">${ic('search',18,2)}</span><span class="t">‘${esc(q)}’ 검색하기${bits.length>1?`<small class="parsed">${bits.map(esc).join(' · ')}(으)로 찾아볼게요</small>`:''}</span><span></span></button></li>
   ${hits.map(([n,c])=>`<li><button class="rk wimg" data-act="pick" data-v="${n}"><span class="n">${ic('search',18,2)}</span>${rankImg(n)}<span class="t">${mark(n)}<small>${c} · 올리브영 인기 ${RANK.findIndex(x=>x[0]===n)+1}위</small></span><span></span></button></li>`).join('')}</ol>`;
}

규칙
- candidates는 가능성이 높은 순서로 최대 3개야. 검색어가 특정 제품 하나를 정확히 가리키면 1개만 적어.
- brand는 브랜드명, name은 브랜드를 뺀 제품명, cat은 "아이","립","치크","베이스" 중 하나야.
- type은 제품 형태로 "팔레트","싱글 섀도우","리퀴드","틴트","립스틱","글로스","블러셔","쿠션","파운데이션","기타" 중 하나야.
- desc는 제품 특징을 15자 안팎으로 적어. 예: "4구 · 글리터 2 + 매트 2".
- 웹 검색을 쓸 수 있으면 먼저 올리브영, 브랜드 공식몰, 네이버 쇼핑에서 실제 판매 정보를 확인해. 판매처에 있는 제품명과 색상명만 적고 지어내지 마.
- colors는 그 제품의 실제 색상(호수) 라인업 전체야. 빠짐없이 최대 40개, 각각 {"name":"공식 색상명","hex":"#RRGGBB"}로 적어. hex는 그 색의 대표 색이야.
- 검색어가 "브랜드 + 색상 이름/호수/색 계열"일 수 있어. 예: "롬앤 무화과", "페리페라 03", "클리오 코랄". 이때는 그 브랜드 제품 중에서 그 색상이 실제로 있는 제품을 찾아 후보로 적어. 같은 색상명이 여러 제품에 있으면 대표 제품 순서로 최대 3개야.
- 각 후보의 match에는 검색어가 가리키는 색상을 그 후보 colors 안의 name과 똑같은 글자로 적어. 색 계열 단어(코랄, 핑크 등)면 그 계열에 가장 가까운 색상 하나를 골라. 검색어에 색상 정보가 없으면 match는 빈 문자열이야.
- 정확히 아는 제품이 없으면 sure를 false로 하고, 검색어와 비슷한 일반적인 제품을 적어.

형식 예시
{"sure":true,"candidates":[{"brand":"○○","name":"아이 팔레트","cat":"아이","type":"팔레트","desc":"4구 · 글리터 2 + 매트 2","colors":[{"name":"01 로즈 브라운","hex":"#B98273"}],"match":""}]}`;
const TYPES_BY_CAT={아이:'팔레트',립:'틴트',치크:'블러셔',베이스:'쿠션'};
function fallbackCands(q){const pq=parseQuery(q),g=guessCat(q),cat=g==='아이'&&!/섀도|팔레트|아이|라이너|마스카라|글리터|브로우/.test(q)&&(pq.color||pq.num)?'립':g; // brand + shade with no product word is most often a lip
  let colors=CAT_SW[cat].map(([name,hex])=>({name,hex}));
  const shade=[pq.num,pq.color].filter(Boolean).join(' ');
  if(shade&&matchColor(colors,'',q)<0)colors=[{name:shade,hex:pq.hex||colors[0].hex},...colors];
  return[{brand:pq.brand,name:pq.brand?(pq.rest||`${cat} 제품`):q,cat,type:TYPES_BY_CAT[cat],desc:`${cat} · 대표 컬러 예시`,colors,match:matchColor(colors,'',q)}]}
// Index of the colour the search pointed at: the AI's pick, else the query's shade number or colour word.
function matchColor(colors,hint,q){
  const pq=parseQuery(q||(S.core&&S.core.q)||''),norm=s=>String(s).replace(/\s/g,'').toLowerCase();
  const tries=[hint,pq.num&&pq.num.padStart(2,'0'),pq.num,pq.color].filter(Boolean);
  for(const h of tries){const i=colors.findIndex(c=>norm(c.name)===norm(h));if(i>=0)return i}
  for(const h of tries){const i=colors.findIndex(c=>norm(c.name).includes(norm(h)));if(i>=0)return i}
  return -1;
}
function normCands(d){
  if(!d||!Array.isArray(d.candidates))return null;
  const cats=['아이','립','치크','베이스'],types=['팔레트','싱글 섀도우','리퀴드','틴트','립스틱','글로스','블러셔','쿠션','파운데이션','기타'];
  const out=d.candidates.slice(0,3).map(c=>{
    const cat=cats.includes(c&&c.cat)?c.cat:guessCat(String(c&&c.name||''));
    const colors=(Array.isArray(c&&c.colors)?c.colors:[]).filter(x=>x&&x.name&&/^#[0-9a-f]{6}$/i.test(String(x.hex))).slice(0,40).map(x=>({name:String(x.name).slice(0,30),hex:x.hex}));
    const cl=colors.length?colors:CAT_SW[cat].map(([name,hex])=>({name,hex}));
    return{brand:String(c&&c.brand||'').slice(0,20),name:String(c&&c.name||'').slice(0,40),cat,type:types.includes(c&&c.type)?c.type:TYPES_BY_CAT[cat],desc:String(c&&c.desc||'').slice(0,30),colors:cl,match:matchColor(cl,String(c&&c.match||''))};
  }).filter(c=>c.name);
  return out.length?{cands:out,sure:d.sure!==false}:null;
}

const FACE_PROMPT=`이 사진은 메이크업 추천을 위해 사용자가 올린 얼굴 사진이야. 얼굴 각 부위의 위치를 찾아 JSON 하나로만 답해.

규칙
- 좌표는 사진 전체 너비와 높이를 각각 100으로 본 퍼센트 숫자야.
- 각 부위는 그 부위를 감싸는 타원 {"cx","cy","rx","ry"}로 적어. rx는 너비 기준, ry는 높이 기준 퍼센트야.
- face는 이마(헤어라인)부터 턱 끝까지, 양쪽 볼 바깥선까지의 얼굴 윤곽이야. 머리카락, 귀, 목은 넣지 마.
- leftEye와 rightEye는 사진에서 왼쪽과 오른쪽에 보이는 눈, 눈꺼풀이 열린 부분만 감싸. nose는 콧대부터 콧볼까지, lips는 입술 윤곽만 감싸.
- 모든 타원은 해당 부위에 딱 맞게 그리고 여유를 크게 두지 마.
- traits.eyes에는 눈매 특징을 10자 안팎으로(예: "살짝 올라간 눈꼬리"), traits.face에는 얼굴형(예: "계란형")을 적어.
- traits.report에는 메이크업용 얼굴 분석을 적어. 각 항목은 아래 보기 중 하나만 고르고, 사진으로 확실하지 않으면 "보통"(또는 "수평","균형형")을 골라.
  - shape: "계란형","둥근형","긴형","각진형","하트형","다이아몬드형"
  - thirds: 이마(헤어라인~눈썹) : 중안부(눈썹~코끝) : 하안부(코끝~턱끝) 길이 비율. 중안부를 1로 둔 숫자 3개. 예: [1,1,0.9]
  - curve: 얼굴선과 이목구비가 곡선적이면 -1, 직선적이면 1에 가까운 -1~1 숫자
  - mature: 이목구비가 어려 보이면(짧은 하관, 둥근 눈, 작은 코) -1, 성숙해 보이면 1에 가까운 -1~1 숫자
  - eyeShape: 눈매를 8자 안팎으로(예: "둥근 눈매","가로로 긴 눈매")
  - tail(눈꼬리): "올라감","수평","내려감" / lid(쌍꺼풀): "무쌍","속쌍","겉쌍" / eyeSize: "작은 편","보통","큰 편"
  - gap(미간, 눈 가로 길이 대비): "좁은 편","보통","넓은 편" / lidArea(눈두덩 면적): "좁은 편","보통","넓은 편"
  - nose(코 길이): "짧은 편","보통","긴 편"
  - lipThick: "얇은 편","보통","도톰한 편" / lipRatio: "윗입술이 얇음","균형","윗입술이 도톰함" / corner(입꼬리): "올라감","수평","내려감"
  - spread(이목구비 배치): "구심형"(가운데로 모임),"균형형","원심형"(바깥으로 퍼짐)

  - browShape(눈썹): "일자","완만한 아치","각진 아치" / browThick: "얇은 편","보통","진한 편"
  - noseBridge(콧대): "낮은 편","보통","높은 편" / noseWidth(콧볼): "좁은 편","보통","넓은 편"
  - lipWidth(입 너비, 눈동자 안쪽 간격 대비): "좁은 편","보통","넓은 편"
  - cheekFull(볼살): "꺼진 편","보통","도톰한 편" / cheekLen(눈 밑~입꼬리 볼 여백): "짧은 편","보통","긴 편"
  - cbFront(앞광대): "평평한 편","보통","도톰한 편" / cbSide(옆광대): "안 보임","보통","도드라짐"
  - jawShape(턱선): "둥근 턱선","보통","각진 턱선" / chin(턱 끝 길이): "짧은 편","보통","긴 편"

// Real faces keep fairly stable proportions to the distance between the eyes (≈63mm): face ≈ 2.1× wide,
// ≈ 2.9× tall; an eye ≈ 0.5×; lips ≈ 0.8×. Parts far off those ratios (usually loose AI ellipses that
// take in hair or neck) are pulled back, so a small face gets small outlines.
function refineLm(lm,dims){
  const W=dims.w,H=dims.h,px=o=>({cx:o.cx*W/100,cy:o.cy*H/100,rx:o.rx*W/100,ry:o.ry*H/100}),pc=o=>({cx:o.cx/W*100,cy:o.cy/H*100,rx:o.rx/W*100,ry:o.ry/H*100});
  const P={};PARTS.forEach(k=>P[k]=px(lm[k]));
  const d=Math.hypot(P.rightEye.cx-P.leftEye.cx,P.rightEye.cy-P.leftEye.cy);
  if(!(d>4))return lm;
  const want={face:[1.08,1.5],leftEye:[.27,.13],rightEye:[.27,.13],nose:[.2,.42],lips:[.42,.17]};
  const fit=(v,e)=>v>e*1.2?e*1.08:v<e*.6?e*.8:v;
  const out={};
  PARTS.forEach(k=>{const o=P[k],[a,b]=want[k];out[k]=pc({cx:o.cx,cy:o.cy,rx:fit(o.rx,a*d),ry:fit(o.ry,b*d)})});
  // the outline should sit around the features, a little above the eye–mouth midpoint
  const mid=(P.leftEye.cy+P.lips.cy)/2;if(Math.abs(P.face.cy-mid)>.35*d)out.face.cy=(mid-.08*d)/H*100;
  return out;
}
// Browser face detection where available (no upload, runs on the device).
async function detectLocal(file,dims){
  if(!('FaceDetector' in window))return null;
  try{
    const bmp=await createImageBitmap(file);
    const f=(await new FaceDetector({fastMode:false,maxDetectedFaces:1}).detect(bmp))[0];if(!f)return null;
    const b=f.boundingBox,W=dims.w,H=dims.h,pt=(x,y)=>({x,y});
    const marks=t=>((f.landmarks||[]).filter(l=>l.type===t).map(l=>l.locations.reduce((s,p)=>pt(s.x+p.x/l.locations.length,s.y+p.y/l.locations.length),pt(0,0))));
    const eyes=marks('eye').sort((a,b)=>a.x-b.x),mouth=marks('mouth')[0],nose=marks('nose')[0];
    const L=eyes[0]||pt(b.x+b.width*.32,b.y+b.height*.4),R=eyes[1]||pt(b.x+b.width*.68,b.y+b.height*.4);
    const M=mouth||pt(b.x+b.width/2,b.y+b.height*.78),N=nose||pt(b.x+b.width/2,b.y+b.height*.6);
    const e=(cx,cy,rx,ry)=>({cx:cx/W*100,cy:cy/H*100,rx:rx/W*100,ry:ry/H*100});
    return{leftEye:e(L.x,L.y,b.width*.12,b.height*.05),rightEye:e(R.x,R.y,b.width*.12,b.height*.05),nose:e(N.x,N.y-b.height*.05,b.width*.08,b.height*.12),
      lips:e(M.x,M.y,b.width*.2,b.height*.07),face:e(b.x+b.width/2,b.y+b.height*.47,b.width*.5,b.height*.62)};
  }catch(e){return null}
}

function typeInto(text,speed,done){
  let i=0;S.draft='';
  const step=()=>{
    if(S.screen!=='s3')return;
    i=Math.min(text.length,i+2);S.draft=text.slice(0,i);
    const t=dev.querySelector('#draft');if(t){t.value=S.draft;autosize(t);dev.querySelector('#sendbtn').disabled=false}
    if(i<text.length)later(step,speed);else done&&done();
  };step();
}
function enterS3(){}
function toggleMic(){
  if(S.phase==='loading')return;
  if(S.listening){S.listening=false;clearTimers();render();return}
  clearTimers();S.listening=true;render();
  typeInto(DEMO_MSG,40,()=>{S.listening=false;render()});
}
const saysNone=t=>/(고민|딱히).{0,6}없/.test(t);
// Messages are collected with a short acknowledgement; the summary runs once, on the bottom button.
// The third reply names the bottom button by its current label so the two always match.
const sumLabel=()=>S.concerns&&S.concerns.length?'다음':'다 적었어요, 정리해 주세요';
const ACKS=['네, 적어둘게요. 더 있으면 편하게 이어서 말해주세요!','좋아요, 메모했어요. 또 신경 쓰이는 부분이 있나요?',()=>`알겠어요! 다 적으셨으면 맨 아래 파란 버튼 ‘${sumLabel()}’를 눌러주세요.`];
const meCount=()=>S.chat.filter(m=>m.from==='me').length;
function send(){
  const text=S.draft.trim();if(!text||S.phase==='loading')return;
  clearTimers();S.listening=false;
  S.chat.push({from:'me',text});S.draft='';
  if(!S.concerns&&saysNone(text)&&!extractConcerns(S.chat.filter(m=>m.from==='me').map(m=>m.text).join(' ')).length){
    S.concerns=[];S.summarized=meCount();S.phase='result';S.chat.push({from:'ai',text:AI_NONE});render();autoNext();return;
  }
  const n=meCount()-(S.summarized||0);
  S.phase='collect';S.sheet='closed';
  const a=ACKS[Math.min(n,ACKS.length)-1];S.chat.push({from:'ai',text:typeof a==='function'?a():a});render();
}
function autoNext(){later(()=>{if(S.screen==='s3'&&S.concerns&&!S.concerns.length){S.concernSkipped=false;next('s3')}},1400)}
function summarize(){
  if(S.phase==='loading')return;
  clearTimers();
  const mine=S.chat.filter(m=>m.from==='me').map(m=>m.text),fresh=mine.slice(S.summarized||0);
  if(!fresh.length)return;
  S.phase='loading';S.editing=null;S.adding=false;render();
  const seq=reqSeq,n=mine.length;
  const done=(items,msg)=>{S.concerns=items;S.summarized=n;S.phase='result';S.chat.push({from:'ai',text:msg});render();if(items.length)later(()=>{S.sheet='open';render()},450)};
  if(S.concerns&&S.concerns.length){
    reviseConcerns(fresh.join('\n')).then(({items})=>{
      if(seq!==reqSeq||S.screen!=='s3')return;
      if(items)done(items,AI_REVISED);
      else{S.summarized=n;S.phase='result';S.chat.push({from:'ai',text:AI_REVISE_ASK});render()}
    });
    return;
  }
  recognize(mine.join('\n')).then(({items,ask,none})=>{
    if(seq!==reqSeq||S.screen!=='s3')return;
    if(none){done([],AI_NONE);autoNext();return}
    if(items.length)done(items,AI_OK);
    else{S.phase='fail';S.chat.push({from:'ai',text:ask||AI_RETRY,hint:AI_RETRY_HINT});render()}
  });
}

let aiOff=false;
const samplePromise=(window.claude&&typeof window.claude.use==='function')?window.claude.use('sample').catch(()=>null):Promise.resolve(null);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// Optional server for use outside claude.ai (see deploy/README.md). Empty = built-in Claude or examples only.
const API_BASE=(document.querySelector('meta[name="api-base"]')?.content||'').trim().replace(/\/$/,'');
// Photos go to the server as JPEG, longest side ≤1600px, to stay well under request limits.
async function toB64(blob){
  const bmp=await createImageBitmap(blob),s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return{type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]};
}
async function aiJson(prompt,o={}){
  if(o.web&&API_BASE){
    try{
      const r=await fetch(API_BASE+'/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,images:[],effort:'medium',web:true})});
      if(r.ok){const j=await r.json();if(o.onSources)o.onSources(Array.isArray(j.sources)?j.sources:[]);return j.data}
    }catch(e){/* fall through to the plain answer */}
  }
  const sample=aiOff?null:await samplePromise;
  if(sample){
    if(o.images){const lim=await sample.limits().catch(()=>null);if(!lim||!lim.images)throw{code:'images_unavailable'}}
    return sample.json(prompt,{...(o.images?{images:o.images}:{}),modelTier:o.tier||'quick'});
  }
  if(API_BASE){
    const images=o.images?await Promise.all(o.images.map(toB64)):[];
    const r=await fetch(API_BASE+'/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,images,effort:o.tier==='default'?'medium':'low'})});
    if(!r.ok)throw{code:r.status===429?'rate_limited':'upstream_error',status:r.status};
    return (await r.json()).data;
  }
  throw{code:'unavailable'};
}
// Real product listings (name, photo, lowest price, shop link) from Naver Shopping via the server.
async function shopSearch(q){
  if(!API_BASE)return null;
  try{const r=await fetch(API_BASE+'/shop?q='+encodeURIComponent(q.slice(0,60)));if(!r.ok)return null;const j=await r.json();return Array.isArray(j.items)?j.items:null}catch(e){return null}
}
const OFF_CODES=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','session_expired'];
const AI_PROMPT=said=>`너는 메이크업 앱에서 사용자의 평소 메이크업 고민을 정리하는 도우미야. 아래 사용자의 말에서 고민을 뽑아서 JSON 하나로만 답해.

규칙
- area는 "베이스","아이","치크","립","전체" 중 하나만 써. 특정 부위가 아니면 "전체".
- text는 고민을 15자 안팎의 짧은 명사형으로 요약해. 예: "오후에 베이스가 무너짐", "눈두덩 칙칙함", "룩이 늘 비슷함".
- quote에는 그 고민이 나온 사용자의 말을 그대로 짧게 옮겨.
- 같은 고민은 한 번만 적고, 사용자가 말하지 않은 고민은 지어내지 마.
- 사용자가 고민이 없다고 하면 ok를 true, concerns를 빈 배열로 해.
- 고민을 알 수 없으면 ok를 false로 하고, ask에 더 물어볼 질문 한 문장을 친근한 존댓말로 적어.

형식 예시
{"ok":true,"concerns":[{"area":"베이스","text":"오후에 베이스가 무너짐","quote":"오후만 되면 쿠션이 무너지고"}],"ask":""}

사용자의 말
"""
${said.slice(0,4000)}
"""`;
function normalize(d){
  if(!d||!Array.isArray(d.concerns))return[];
  return d.concerns.slice(0,8).map(c=>({id:newId(),area:AREAS.includes(c&&c.area)?c.area:'전체',text:String(c&&c.text||'').trim().slice(0,30),quote:String(c&&c.quote||'').trim().slice(0,60)})).filter(c=>c.text);
}
async function recognize(said){
  {
    try{
      const d=await aiJson(AI_PROMPT(said));
      const items=normalize(d);
      if(d&&d.ok===false&&!items.length)return{items:[],ask:String(d.ask||'').slice(0,120)};
      if(d&&d.ok===true&&Array.isArray(d.concerns)&&!d.concerns.length)return{items:[],none:true};
      if(items.length)return{items};
    }catch(e){if(OFF_CODES.includes(e&&e.code))aiOff=true}
  }
  await wait(1200);
  return{items:extractConcerns(said)};
}

/* ---- follow-up messages revise the concern list already on screen ---- */
const REVISE_PROMPT=(cur,msg)=>`너는 메이크업 앱에서 사용자의 메이크업 고민 목록을 정리하는 도우미야. 아래 "현재 고민"을 사용자의 "수정 요청"대로 고쳐서, 고친 뒤의 목록 전체를 JSON 하나로만 답해.

규칙
- 요청과 관계없는 고민은 그대로 둬.
- 고민 추가, 삭제, 내용 수정, 부위 변경을 요청대로 반영해.
- area는 "베이스","아이","치크","립","전체" 중 하나만 써. text는 15자 안팎의 짧은 명사형으로 써.
- 사용자가 말하지 않은 고민은 지어내지 마.
- 요청이 고민 수정과 관계없거나 무엇을 바꿀지 알 수 없으면 changed를 false로 해.

형식 예시
{"changed":true,"concerns":[{"area":"베이스","text":"다크서클","quote":"다크서클도 고민이에요"}]}

현재 고민
${JSON.stringify(cur)}

수정 요청
"""
${msg.slice(0,2000)}
"""`;
async function reviseConcerns(msg){
  const cur=S.concerns.map(c=>({area:c.area,text:c.text,quote:c.quote}));
  {
    try{
      const d=await aiJson(REVISE_PROMPT(cur,msg));
      if(d&&d.changed===false)return{items:null};
      if(d&&Array.isArray(d.concerns))return{items:normalize(d)};
    }catch(e){if(OFF_CODES.includes(e&&e.code))aiOff=true}
  }
  await wait(1000);
  return{items:kwRevise(msg)};
}
// Keyword fallback: add newly mentioned concerns, or remove the matching ones when the message says to.
function kwRevise(msg){
  const found=extractConcerns(msg);if(!found.length)return null;
  const remove=/빼|지워|삭제|아니에요|아니야|없어졌|괜찮아졌/.test(msg);
  const key=t=>t.replace(/^(피부|눈두덩|볼|입술) /,'');
  let items=S.concerns.map(c=>({...c}));
  for(const f of found){
    if(remove){items=items.filter(c=>key(c.text)!==key(f.text));continue}
    if(!items.some(c=>c.text===f.text))items.push(f);
  }
  return items;
}

const SHELF_PROMPT=`이 사진은 사용자의 화장대야. 보이는 메이크업 제품을 찾아서 JSON 하나로만 답해.

규칙
- item은 다음 중 하나만 써: ${'선크림, 프라이머/프렙, 쿠션, 파운데이션, 컨실러, 파우더, 섀도우, 아이라이너, 마스카라, 브로우, 브로우카라, 블러셔, 하이라이터, 쉐딩, 틴트, 립스틱, 립글로스, 립라이너, 립밤, 기타'}.
- name은 라벨에서 읽은 브랜드와 제품명이야. 읽을 수 없으면 "".
- shade는 색상 정보야. 이 순서로 정해:
  1) 라벨에 색상명·호수가 보이면 그대로 적어. 예: "21호", "03 코랄 피치".
  2) 제품명을 읽었고 그 제품의 색상 라인업을 알고 있다면, 보이는 색과 가장 가까운 공식 색상명을 적고 뒤에 " (추정)"을 붙여.
  3) 둘 다 아니면 보이는 내용물·용기 색으로 가장 가까운 일반 색상명을 적고 " (추정)"을 붙여. 예: "코랄 핑크 (추정)", "토프 브라운 (추정)".
  색이 의미 없는 제품(선크림, 프라이머 등)은 "".
- hex는 제품 내용물에서 보이는 대표 색을 "#RRGGBB"로 적어. 내용물이 안 보이거나 색이 의미 없으면 "".
- conf는 종류·이름·색상이 확실하면 "high", 하나라도 추측이 섞였으면 "low".
- box는 사진 전체를 100으로 봤을 때 [왼쪽, 위, 너비, 높이] 퍼센트 숫자 4개야.

형식 예시
{"items":[{"item":"쿠션","name":"○○ 커버 쿠션","shade":"21호","hex":"#ECCDB5","conf":"high","box":[22,52,22,34]},{"item":"틴트","name":"","shade":"코랄 핑크 (추정)","hex":"#EE8478","conf":"low","box":[70,20,8,45]}]}`;

    if(s.phase==='loading')s.phase=s.concerns?'result':'collect';
    if(s.photoState==='analyzing'||(s.photoState==='done'&&!s.photo))s.photoState='none';
    if(s.shelf&&s.shelf.state==='analyzing')s.shelf.state=s.shelf.items.length?'done':'none';
    if(s.core&&!s.core.ready)s.core.ready=true;
    Object.assign(s,{reportState:null,repOpen:false,camera:false,camLive:false,listening:false,popup:null,preview:false,editing:null,adding:false});
    return s;
  }catch(e){return null}
}
function clearSaved(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
// In-memory copy of the user's own state while an example state is on screen (works even without storage).
let userSnap=null;
function cloneState(s){try{return structuredClone(s)}catch(e){const c=JSON.parse(snapshot(false)).S;c.photoFile=s.photoFile;c.shelf.file=s.shelf.file;return c}}

/* ================= screen navigator (prototype review) ================= */
const NAV=[
 ['S0','웰컴','s0'],['S1','기본 정보','s1'],['S2','선호 분위기','s2'],['S2b','퍼스널컬러','pc'],['S3a','메이크업 단계','rt'],['S3b','화장대 사진','shelf'],['3b-a','제품 분석 중','shelf-analyzing',1],['3b-b','분석 결과 확인','shelf-done',1],['S3c','평소 고민 대화','s3'],
 ['3c-a','고민 모으는 중','s3-collect',1],['3c-b','정리 중 로딩','s3-loading',1],['3c-c','정리된 고민 시트','s3-result',1],['3c-d','인식 실패 재질문','s3-fail',1],
 ['S4','얼굴 사진','s4'],['4-a','분석 완료','s4-done',1],['S6','완료 요약','s6'],['홈','검색 홈','home'],['홈-a','검색 + 인기 순위','search',1],
 ['#','핵심 씬 스케치'],
 ['C1','제품 확인 · 명확화','c1'],['C2','단계적 질문','c2'],['C3','선호 비교','c3'],['C4','단계별 룩 + 영상','c4'],['C5','구매 결정','c5'],['C6','최저가','c6'],
];
let navKey='s0';
function sample(upto){
  let i=ORDER.indexOf(upto);if(i<0)i=ORDER.length;
  const at=k=>ORDER.indexOf(k);
  if(i>at('s1')){if(!S.nick)S.nick='지윤';if(!S.age)S.age='20대 후반';if(!S.gender)S.gender='여성'}
  if(i>at('s2')&&!S.moods.length)S.moods=['natural','mute'];
  if(i>at('pc')&&!S.pc&&!S.pcSkipped)S.pc='summer-mute';
  if(i>at('rt')&&!S.routine.length)S.routine=[...USUAL];
  if(i>at('shelf')&&S.shelf.state!=='done'&&!S.shelf.skipped)Object.assign(S.shelf,{photo:'demo',file:null,state:'done',items:SHELF_DEMO.map(x=>({...x,id:newId()})),note:''});
  if(i>at('s3')&&!S.concerns&&!S.concernSkipped){S.chat=[{from:'ai',text:AI_FIRST},{from:'me',text:DEMO_MSG},{from:'ai',text:AI_OK}];S.concerns=extractConcerns(DEMO_MSG);S.summarized=1;S.phase='result';S.sheet='open'}
  if(i>at('s4')&&S.photoState!=='done'&&!S.photoSkipped){S.photo='demo';S.photoFile=null;S.photoDims={w:1,h:1};S.faceLm=DEMO_LM;S.faceTraits={eyes:'둥근 눈매',face:'계란형',report:DEMO_REPORT};S.faceNote='';S.photoState='done'}
}
function jump(key){
  clearTimers();
  const isPreview=NAV.some(n=>n[2]===key&&n[3]);
  if(isPreview&&!S.preview){saveNow();userSnap=cloneState(S);S.preview=true}
  else if(!isPreview&&S.preview){S=userSnap||loadSaved()||S;userSnap=null;S.preview=false}
  navKey=key;S.returnTo=null;S.editing=null;S.adding=false;
  const base=key.split('-')[0];sample(base);
  if(base==='s3'){
    S.listening=false;if(isPreview)S.draft='';
    if(key==='s3-collect'){S.chat=[{from:'ai',text:AI_FIRST},{from:'me',text:'오후만 되면 쿠션이 무너지고 코 옆이 번들거려요.'},{from:'ai',text:ACKS[0]},{from:'me',text:'눈두덩이가 칙칙해 보이고 섀도우는 매번 비슷한 느낌이에요.'},{from:'ai',text:ACKS[1]}];S.concerns=null;S.summarized=0;S.phase='collect';S.sheet='closed'}
    if(key==='s3-loading'){S.chat=[{from:'ai',text:AI_FIRST},{from:'me',text:DEMO_MSG}];S.concerns=null;S.summarized=0;S.phase='loading';S.sheet='closed'}
    if(key==='s3-result'){S.chat=[{from:'ai',text:AI_FIRST},{from:'me',text:DEMO_MSG},{from:'ai',text:AI_OK}];S.concerns=extractConcerns(DEMO_MSG);S.summarized=1;S.phase='result';S.sheet='open'}
    if(key==='s3-fail'){S.chat=[{from:'ai',text:AI_FIRST},{from:'me',text:'그냥 그래요'},{from:'ai',text:AI_RETRY,hint:AI_RETRY_HINT}];S.concerns=null;S.summarized=0;S.phase='fail';S.sheet='closed'}
  }
  if(base==='shelf'){
    Object.assign(S.shelf,{hl:null,editing:null,adding:null,note:'',file:null});
    if(key==='shelf-done')Object.assign(S.shelf,{photo:'demo',state:'done',items:SHELF_DEMO.map(x=>({...x,id:newId()}))});
    if(key==='shelf-analyzing')S.shelf.photo='demo';
  }
  if(key==='s4-done'){S.photo='demo';S.photoFile=null;S.photoDims={w:1,h:1};S.faceLm=DEMO_LM;S.faceTraits={eyes:'둥근 눈매',face:'계란형',report:DEMO_REPORT};S.faceNote='';S.photoState='done'}
  if(CORE.includes(base)){
    if(!S.core)S.core=coreState('글리터 섀도우 팔레트');
    const k=S.core,n=CORE.indexOf(base)+1;
    if(n>1){if(!k.cands)k.cands=fallbackCands(k.q);if(k.prod===null){const c=k.cands[0];Object.assign(k,{prod:0,prodName:fullName(c),colors:c.colors,cat:c.cat})}if(k.color===null)k.color=Math.min(1,coreColors().length-1)}
    if(n>2){k.occ=k.occ||'데일리';k.have=k.have||shelfFor(...HAVE_TYPES[k.cat])||HAVE[k.cat][0];k.ready=true}
    if(n>3&&!k.variant){k.variant=lookDirs()[0];k.tone=lookOf(k.variant).tone}
    k.step=0;
    k.store=null;k.sheet=null;k.busy=false;
  }
  S.screen=base;anim='fwd';S.camera=false;render();
  if(key==='shelf-analyzing')analyzeShelf();
  if(key==='s3-loading')later(()=>{S.concerns=extractConcerns(DEMO_MSG);S.summarized=1;S.phase='result';S.chat.push({from:'ai',text:AI_OK});render();later(()=>{S.sheet='open';render()},450)},2600);
}
function renderNav(){
  const pv=document.getElementById('pvnote');if(pv)pv.hidden=!S.preview;
  const cur=navKey.split('-')[0]===S.screen?navKey:S.screen;
  document.getElementById('navlist').innerHTML=NAV.map(([c,l,k,sub])=>c==='#'?`<li class="sec">${l}</li>`:`<li class="${sub?'sub':''}"><button data-k="${k}" aria-current="${k===cur}"><span class="code">${c}</span>${l}</button></li>`).join('');
  navKey=cur;
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.popup){S.popup=null;render()}});
document.getElementById('navlist').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b)jump(b.dataset.k)});
{let armT=null;const rb=document.getElementById('reset');
 rb.addEventListener('click',()=>{
  if(!rb.classList.contains('confirm')){rb.classList.add('confirm');rb.textContent='한 번 더 누르면 모두 지워져요';clearTimeout(armT);armT=setTimeout(()=>{rb.classList.remove('confirm');rb.textContent='입력값 모두 지우기'},3500);return}
  clearTimeout(armT);rb.classList.remove('confirm');rb.textContent='입력값 모두 지우기';
  clearTimers();clearSaved();S=fresh();navKey='s0';anim='back';render();toast('입력값을 모두 지웠어요');
 });}

/* ================= fit the 390×844 frame to the window ================= */
function fit(){
  const w=document.getElementById('devwrap');
  if(innerWidth<=720){w.style.width='';w.style.height='';dev.style.transform='';return}
  const sc=Math.min(1,(innerHeight-48)/(844+22));
  dev.style.transform=`translate(${11*sc}px,${11*sc}px) scale(${sc})`;
  w.style.width=(390+22)*sc+'px';w.style.height=(844+22)*sc+'px';
}
addEventListener('resize',fit);fit();
{const sv=loadSaved();if(sv){S=sv;navKey=S.screen}}
